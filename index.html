<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5">
      <form id="dataForm" class="row g-3">
        <div class="col-12 col-md-3">
          <label for="day" class="form-label">Day</label>
          <input
            type="number"
            min="1"
            max="31"
            class="form-control"
            id="day"
            placeholder="Day"
            onkeydown="ControlDayInput(event)"
            tabindex="1"
            required
          />
          <label
            id="dayAlert"
            class="form-label text-danger"
            style="display: none"
          >
            Please enter a number between 1 and 7.
          </label>
        </div>
        <div class="col-12 col-md-4">
          <label for="startTime" class="form-label">Start Time</label>
          <input
            type="time"
            class="form-control"
            id="startTime"
            tabindex="2"
            required
          />
        </div>
        <div class="col-12 col-md-4">
          <label for="endTime" class="form-label">End Time</label>
          <input
            type="time"
            class="form-control"
            id="endTime"
            tabindex="3"
            required
          />
        </div>
        <div class="col-12 col-md-3">
          <label for="category" class="form-label">Category</label>
          <select id="category" class="form-select" tabindex="4" required>
            <option value="" disabled selected>Select category</option>
            <option value="Meeting">Meeting</option>
            <option value="WriteCode">Write Code</option>
            <option value="Review Code">Review Code</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="col-12 col-md-2 d-flex align-items-end">
          <button type="submit" class="btn btn-primary w-100" tabindex="5">
            Add
          </button>
        </div>
      </form>
      <table class="table mt-4">
        <thead>
          <tr>
            <th>Day</th>
            <th>Start Time</th>
            <th>End Time</th>
            <th>Category</th>
          </tr>
        </thead>
        <tbody id="dataTableBody">
          <!-- Data rows will be added here -->
        </tbody>
      </table>
      <section>
        <div class="row">
          <div class="col-12 col-md-4">
            <div class="card">
              <div class="card-body">
                <h5 class="card-title">Total Time Spent on Meetings</h5>
                <p class="card-text" id="totalMeetingTime">0 hours</p>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-4">
            <div class="card">
              <div class="card-body">
                <h5 class="card-title">Total Time Spent on Write Code</h5>
                <p class="card-text" id="totalWriteCodeTime">0 hours</p>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-4">
            <div class="card">
              <div class="card-body">
                <h5 class="card-title">Total Time Spent on Review Code</h5>
                <p class="card-text" id="totalReviewCodeTime">0 hours</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./javascript.js"></script>
  </body>
</html>
